# EVERGREEN topics: reference content that does not depend on today's news.
# A topic is only proposed when enough stored, well-labelled stories support it (config/publishing.yaml
# -> buckets.evergreen). The keywords select supporting stories from the database; they are never a
# source of facts. An evergreen article is still written only from an evidence packet.
topics:
  characters:
    title: "Jason and Lucia: what is on the record about GTA VI's protagonists"
    keywords: ["jason", "lucia", "protagonist", "duval", "caminos"]
    format: "Reference article + character short"
  map_regions:
    title: "Leonida's regions: what has been shown and said so far"
    keywords: ["leonida", "vice city", "region", "map", "grassrivers", "ambrosia", "keys"]
    format: "Structured reference article"
  weather:
    title: "Weather in GTA VI: what Rockstar has described"
    keywords: ["weather", "hurricane", "storm"]
    format: "Explainer article + short"
  wildlife:
    title: "Wildlife in GTA VI: what has been reported"
